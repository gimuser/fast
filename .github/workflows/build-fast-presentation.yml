name: Build FAST presentation

on:
  push:
    branches: [main]
    paths:
      - 'fast_generate.py'
      - 'Presentation_Methode_FAST.pptx'
      - '.github/workflows/build-fast-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --upgrade pip python-pptx
      - name: Generate presentation
        run: python fast_generate.py Presentation_Methode_FAST.pptx
      - name: Validate generated PowerPoint
        run: |
          python - <<'PY'
          from pptx import Presentation
          p = Presentation("FAST_Presentation_Methode_FAST.pptx")
          assert len(p.slides) > 0
          print(f"Validated: {len(p.slides)} slides")
          print(f"Slide size: {p.slide_width / 914400:.2f} x {p.slide_height / 914400:.2f} inches")
          for i, slide in enumerate(p.slides, 1):
              print(f"Slide {i}: {len(slide.shapes)} shapes")
          PY
      - name: Upload generated deck
        uses: actions/upload-artifact@v4
        with:
          name: FAST-Presentation
          path: FAST_Presentation_Methode_FAST.pptx
          if-no-files-found: error
